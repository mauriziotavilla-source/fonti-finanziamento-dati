name: Test Push Android

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Topic Firebase da testare
        required: true
        default: bandi_regionali
        type: choice
        options:
          - bandi_regionali
          - bandi_europei
          - bandi_nazionali

jobs:
  test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install scraper dependencies
        working-directory: scripts
        run: npm ci

      - name: Send test push notification
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: npm run scraper:push:test -- --topic=${{ inputs.topic }}
