name: Scraper Bandi

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install scraper dependencies
        working-directory: scripts
        run: npm ci

      - name: Run hybrid scraper
        working-directory: scripts
        run: npm run scraper:run

      - name: Commit updated data files
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No data changes detected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: aggiorna bandi automatici"
          git push

      - name: Mirror data repo
        working-directory: scripts
        env:
          SCRAPER_PUBLISH_REPO: ${{ secrets.SCRAPER_PUBLISH_REPO }}
          SCRAPER_PUBLISH_BRANCH: ${{ secrets.SCRAPER_PUBLISH_BRANCH }}
          SCRAPER_PUBLISH_TOKEN: ${{ secrets.SCRAPER_PUBLISH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run scraper:publish

      - name: Send Android push notifications
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: npm run scraper:push
